name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build
        working-directory: site
        env:
          # The contact address is kept out of the repository: set it as a repository variable (Settings → Secrets
          # and variables → Actions → Variables) named CONTACT_EMAIL. Without it the site shows its other links.
          PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Optional: the Google Search Console verification code (the content of its meta tag).
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
