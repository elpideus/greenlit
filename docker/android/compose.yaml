# Greenlit's Android device, as both compose.yaml (the repository root) and docker/compose.dev.yaml run it (they extend this).
services:
  android:
    build:
      context: ../..
      dockerfile: docker/android/Dockerfile
      args:
        # The Android SDK License hash as already accepted on this machine (sdkmanager --licenses):
        #   ANDROID_SDK_LICENSE=$(cat ~/Android/Sdk/licenses/android-sdk-license)
        ANDROID_SDK_LICENSE: ${ANDROID_SDK_LICENSE:-}
    image: greenlit-android:latest
    restart: unless-stopped
    devices:
      - /dev/kvm
    volumes:
      - android:/data
    environment:
      ANDROID_RAM_MB: ${ANDROID_RAM_MB:-4096}
      ANDROID_CORES: ${ANDROID_CORES:-4}
      TZ: ${TZ:-UTC}
      # auto (default): an NVIDIA GPU when the container has one (compose.nvidia.yaml), else software; or
      # host / software.
      ANDROID_GPU: ${ANDROID_GPU:-auto}
      ANDROID_EMULATOR_FLAGS: ${ANDROID_EMULATOR_FLAGS:-}
