# Greenlit's own models (depth maps) on an NVIDIA graphics card, through NVIDIA's container toolkit on the machine
# (docs/DOCKER.md, "Graphics card"). The image must be the CUDA build:
#   docker build -f docker/Dockerfile --build-arg GPU=cuda -t greenlit:latest .
# Add this file to the compose files you use:
#   docker compose -f compose.yaml -f docker/compose.gpu.yaml up -d
# (or COMPOSE_FILE=compose.yaml:docker/compose.gpu.yaml in .env). Without the toolkit Docker refuses it; without a
# card passed in, the CUDA build simply runs on the processor.
services:
  app:
    build:
      args:
        GPU: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
